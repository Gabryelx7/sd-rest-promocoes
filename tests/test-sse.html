<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway SSE Tester</title>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
        .box { border: 1px solid #333; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        .hotdeal { border-color: #ff5e5e; background: #3a1a1a; }
        .category { border-color: #5e9eff; background: #1a273a; }
        h2 { margin-top: 0; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>

    <h1>📡 SSE Connection Test</h1>
    <p>Using Client ID: <strong>TEST_USER_1</strong></p>

    <div class="box hotdeal">
        <h2>🔥 Global Broadcasts (Hot Deals)</h2>
        <div id="hotdeal-logs">Waiting for Hot Deals...</div>
    </div>

    <div class="box category">
        <h2>🛒 Private Channel (Categories)</h2>
        <div id="category-logs">Waiting for Category Alerts...</div>
    </div>

    <script>
        // 1. Define the Client ID (This matches what you send in X-Client-Id)
        const clientId = "TEST_USER_1";

        // 2. Open TWO connections: One for global broadcasts, one for private messages
        const globalSource = new EventSource("http://127.0.0.1:5000/stream");
        const privateSource = new EventSource(`http://127.0.0.1:5000/stream?channel=${clientId}`);

        // 3. Listen for specific event types
        globalSource.addEventListener('hotdeal', function(event) {
            const data = JSON.parse(event.data);
            const logs = document.getElementById("hotdeal-logs");
            logs.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>` + logs.innerHTML;
        });

        privateSource.addEventListener('category', function(event) {
            const data = JSON.parse(event.data);
            const logs = document.getElementById("category-logs");
            logs.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>` + logs.innerHTML;
        });

        // 4. Basic error handling
        globalSource.onerror = () => console.error("Global SSE connection lost.");
        privateSource.onerror = () => console.error("Private SSE connection lost.");
    </script>

</body>
</html>
